# Sample YAML config for zerobus_feeder.py.
# When passed via --config, all other CLI parameters are ignored.
# Any missing field will cause the script to exit with an error in non-interactive mode.

# Transmission rate in events (records) per second.
eps: 50

# How records reach Zerobus:
#   grpc  — databricks-zerobus-ingest-sdk streaming gRPC connection (default)
#   rest  — Zerobus REST API (Beta): JSON records POSTed over HTTPS, no SDK
#   arrow — Arrow Flight (Beta): columnar pyarrow RecordBatches over the SDK
#           (needs databricks-zerobus-ingest-sdk[arrow]>=1.3.0)
#   otlp  — OpenTelemetry (Beta): synthetic spans/logs/metrics over OTLP/gRPC.
#           For otlp, table_name is the OTel table PREFIX (catalog.schema.prefix);
#           the feeder writes to <prefix>_otel_spans / _logs / _metrics. The
#           data-structure JSON does not apply. Use --create-table to create the
#           three OTel tables. Needs opentelemetry-sdk + the OTLP gRPC exporter.
transport: grpc

# Record serialization for the gRPC transport only (CLI flag: --record-format):
#   json     — no schema needed (default)
#   protobuf — a descriptor is built from schema_file at runtime
# Ignored by the rest (always JSON) and arrow transports.
grpc_format: json

# Path to the JSON file describing the data structure (see sample_schema.json).
schema_file: sample_schema.json

# Zerobus endpoint is built as:
#   AWS:   <workspace_id>.zerobus.<region>.cloud.databricks.com
#   Azure: <workspace_id>.zerobus.<region>.azuredatabricks.net
#   GCP:   <workspace_id>.zerobus.<region>.gcp.databricks.com
workspace_id: "1234567890123456"
region: us-west-2
cloud: aws

# Full target table name. Must already exist as a managed Delta table (or use --create-table).
table_name: main.default.zerobus_feeder_events

# Workspace URL used by the Zerobus SDK. Prefilled automatically from the CLI profile
# when a profile is selected; set explicitly here if you're not using a profile.
workspace_url: "https://dbc-xxxxxxxx-xxxx.cloud.databricks.com"

# Service principal OAuth2 client credentials.
# Run the script once with --create-sp (and --profile) to generate these.
client_id: "00000000-0000-0000-0000-000000000000"
client_secret: "dose_secret_here"

# Optional: Databricks CLI profile, only needed for --create-sp / --create-table.
profile: DEFAULT

# Optional: SQL warehouse used by --create-table. If omitted you'll be prompted.
warehouse_id: ""

# Optional: display name used when --create-sp creates a new service principal.
sp_display_name: zerobus-feeder

# Optional: Zerobus rescue column (Beta, JSON ingestion only). When set, --create-table
# adds a nullable VARIANT column with this name and applies the Unity Catalog
# 'zerobus-rescue' tag. Non-conforming fields (extra fields, or type-mismatched
# values on nullable columns) are then captured in this column instead of the
# whole record being rejected. Leave empty to disable.
# See https://docs.databricks.com/aws/en/ingestion/zerobus-rescue-column
rescue_column: ""

# Optional: percentage (0-100) of generated JSON records that get deliberately
# non-conforming fields injected (an extra field + a type-mismatched value) so
# the rescue column is exercised. 0 disables injection. JSON transports only
# (grpc+json and rest); ignored by protobuf/arrow/otlp.
rescue_inject_pct: 0
